<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>Nakano NZ - payment details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
    <link rel="stylesheet" href="/static/stylesheets/payment_details_styles.css">
  </head>
  <body>
    <div class="container d-flex flex-col mt-4" style="min-height: 100vh">
      <div class="row">
        <div class="col">
          <h3>Nakano NZ - internet banking payment details</h3>
          <table class="table table-responsive mt-5">
            <tbody>
              <tr>
                <td>account name:</td>
                <td>
                  <div class="d-flex flex-row">
                    <div class="" id="accountName">Evergreen Export Ltd</div>
                    <div class="material-symbols-outlined ms-2 copy-icon" id="copyAccountNameBtn">
                      content_copy
                    </div>
                  </div>
                </td>
              </tr>
              <tr>
                <td>account no:</td>
                <td>
                  <div class="d-flex flex-row">
                    <div class="" id="accountNo">01-0745-0378120-00</div>
                    <div class="material-symbols-outlined ms-2 copy-icon" id="copyAccountNoBtn">
                      content_copy
                    </div>
                  </div>
                </td>
              </tr>
              <tr>
                <td>reference:</td>
                <td>please put your name</td>
              </tr>
            </tbody>
          </table>
      </div>
    </div>


      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
      <script type="text/javascript" src="/static/copy_account_details.js">

      </script>
  </body>
</html>
